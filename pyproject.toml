[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-to-flow-distillation"
version = "0.3.1"
description = "LLM-to-Flow Distillation: Teaching Natural Language Goals to Scientific Generators"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = ["pydantic==2.13.4", "requests==2.34.2", "numpy==1.26.4"]

[project.scripts]
llm-to-flow = "adm.cli:main"

[project.urls]
Homepage = "https://llm-to-flow-distillation.github.io/"
Repository = "https://github.com/FedericoDiGennaro/LLM-to-Flow-Distillation"

[project.optional-dependencies]
peptides = ["torch==2.6.0", "transformers==4.56.2", "huggingface-hub==0.36.2", "xgboost==2.1.4", "torchdiffeq==0.2.5", "pandas==2.2.2", "scipy==1.13.1", "scikit-learn==1.3.1", "joblib==1.3.2"]

[tool.setuptools.packages.find]
include = ["adm*", "domains*"]
exclude = ["*.tests*", "*.venv*", "*.pixi*", "*.cache*"]

[tool.setuptools.package-data]
domains = ["**/*.json", "**/*.md", "**/*.sh", "**/*.txt", "**/*.lock", "**/*.toml", "**/*.png"]
